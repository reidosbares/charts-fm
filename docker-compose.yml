services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: chartsfm
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB: chartsfm_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chartsfm -d chartsfm_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    image: node:20-bookworm
    working_dir: /app
    command: sh -c "npm install && npm run dev -- -H 0.0.0.0"
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  node_modules:


